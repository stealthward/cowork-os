.group-note { font-size: 13px; color: var(--muted); margin-top: -12px; }

.alert { width: 100%; box-sizing: border-box; }

.alert-item.open > .alert { background: var(--sunk); border-radius: 6px 6px 0 0; }
.alert-body { background: var(--sunk); border-radius: 0 0 8px 8px; padding: 4px 14px 14px 30px; display: grid; gap: 10px; }
.ab .ah { font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.ab p { margin: 0 0 4px; max-width: 75ch; font-size: 14px; }
.ab a { color: var(--accent); }
.alert-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-clear { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 6px; background: var(--fg); color: var(--bg); }

.cleared-note { font-size: 13px; color: var(--muted); }
.linkish { all: unset; cursor: pointer; margin-left: auto; font: 500 12px/1 var(--body); text-transform: none; letter-spacing: 0; color: var(--accent); }
.cleared-list { opacity: .75; border-top: 1px dashed var(--line); padding-top: 6px; }
.strip30 { display: flex; align-items: flex-end; gap: 2px; height: 14px; margin-top: 5px; }
.strip30 i { display: block; width: 3px; border-radius: 1px; background: var(--line); }
.strip30 i.on { background: var(--accent); }
.seat .strip30 { justify-content: center; }
.probs { margin: 8px 0 0; padding-left: 18px; color: var(--warn); }
.probs li.ackd { color: var(--muted); }
.recent-h { font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
.recent { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }

.src { font-size: 12px; color: var(--muted); margin-top: 8px; }
.allf summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.allf dl { margin-top: 8px; background: transparent; padding: 0; }
.org { display: grid; gap: 18px; }
.org-top { display: flex; flex-direction: column; align-items: center; gap: 6px; }

.org-stem { width: 2px; height: 18px; background: var(--line); }

.org-col { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.seat { all: unset; cursor: pointer; border-top: 3px solid var(--accent); background: var(--sunk); border-radius: 8px; padding: 12px 14px; display: grid; gap: 3px; text-align: center; }
.seat .t { font: 700 17px/1.2 var(--display); }
.seat .s { font-size: 12.5px; color: var(--muted); }
.org-label { font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.worker { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: grid; gap: 3px; min-width: 0; }

.worker:focus-visible, .seat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.worker .t { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }

e. If it repeats, ask the COO: \"check morning-inbox-triage's missed runs.\"", "clears": "Clear it here once you have checked. It also drops off on its own 30 days after the miss."}, {"key": "sched_morning-inbox-triage_2026-10-10-7f3f0d0c", "level": "medium", "name": "morning-inbox-triage", "id": 0, "date": "2026-10-10", "title": "morning-inbox-triage: missed Oct 10", "what": "morning-inbox-triage runs 3x daily, and the triage run log shows no run on Oct 10.", "action": "If the computer or the Claude app was off that day, nothing to fix. If it happens again, ask the COO: \"check why morning-inbox-triage missed runs.\"", "clears": "Clear it here once you have checked. It also drops off on its own 30 days after the miss."}]};
const state = { quiet: false, group: "Systems", q: "", section: null, chip: null, layer: "", platform: "", attn: false, open: new Set() };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shortSection = { "Tools and data (claude.ai projects that run a system)": "Tools & data", "Agents and skills": "Agents & skills" };
const GROUP_NOTE = { Systems: "Things that run: scheduled tasks, scripts, agents and skills, tools and data, connectors.", Workspaces: "Places where work happens. They have lifespans, so each one gets a \"still needed?\" at the monthly alignment check.", Workforce: "The seats under Brett and the workers under each seat. Dashed cards are planned and not built yet. Click any card for its full row.", All: "Every row in the registry." };
const inGroup = (r) => state.group === "All" || (state.group === "Workforce" ? !!r.reportsTo : r.group === state.group);
const chipClass = (c) => "s-" + c.split(/[ ,]/)[0];
const layerGroup = (l) => l.startsWith("Shared Core candidate") ? "Shared Core candidate" : l.startsWith("Shared Core") ? "Shared Core" : l.startsWith("Personal") ? "Personal" : l === "Not recorded" ? "Not recorded" : "Other";

const verified = (DATA.header.match(/Verified[^.]*?(\d{4}-\d{2}-\d{2})/) || [])[1];
$("meta").innerHTML = `Rendered from <b>systems-registry.md</b>${verified ? ` · verified ${esc(verified)}` : ""} · updated ${esc(DATA.rendered)}`;

// Kind tiles
const allTile = (label, n, key) => `<button class="tile" data-section="${key === null ? "" : esc(key)}" aria-pressed="${state.section === key}"><span class="n">${n}</span><span class="l">${esc(label)}</span></button>`;
function drawStrip() {
  const groupCount = (g) => g === "All" ? DATA.rows.length : g === "Workforce" ? DATA.rows.filter((r) => r.reportsTo).length : DATA.rows.filter((r) => r.group === g).length;
  $("groups").innerHTML = ["Systems", "Workspaces", "Workforce", "All"].map((g) => `<button data-group="${g}" aria-pressed="${state.group === g}">${g}<span>${groupCount(g)}</span></button>`).join("");
}
$("groups").addEventListener("click", (e) => {
  const b = e.target.closest("[data-group]"); if (!b) return;
  state.group = b.dataset.group; state.section = null; render();
});


// Layer select
const platforms = [...new Set(DATA.rows.flatMap((r) => r.platforms))].sort((a, b) => a.localeCompare(b));
$("platform").innerHTML = `<option value="">All platforms</option>` + platforms.map((p) => `<option>${esc(p)}</option>`).join("");
$("platform").addEventListener("change", (e) => { state.platform = e.target.value; render(); });
$("q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
function stripHTML(a) {
  if (!a.strip) return "";
  const max = Math.max(1, ...a.strip);
  const today = new Date(DATA.rendered + "T12:00:00");
  return `<div class="strip30" aria-label="Runs per day, last ${DATA.stripDays} days">${a.strip.map((n, i) => {
    const d = new Date(today); d.setDate(d.getDate() - (a.strip.length - 1 - i));
    const h = n ? 4 + Math.round((n / max) * 10) : 2;
    return `<i class="${n ? "on" : ""}" style="height:${h}px" title="${d.toLocaleDateString("en-US", { month: "short", day: "numeric" })}: ${n} run${n === 1 ? "" : "s"}"></i>`;
  }).join("")}</div>`;
}
function actHTML(a) {
  if (!a.tracked) return `<div class="act">${esc(a.note)}</div>`;
  const warn = (a.problems && a.problems.some((p) => !a.ackDates || !a.ackDates.includes(p.date))) || a.quiet;
  return `<div class="act${warn ? " quiet" : ""}">${esc(a.verdict)}</div>${stripHTML(a)}`;
}
let currentAck = [];
function actDetail(a) {
  if (!a.tracked) return esc(a.note) + (a.note === "Not logging yet" ? ". This skill does not write a line to the usage log when it runs." : ".");
  const ackd = Object.fromEntries((currentAck || []).map((k) => [k.date, k]));
  const probs = (a.problems || []).length ? `<ul class="probs">${a.problems.map((p) => `<li${ackd[p.date] ? ' class="ackd"' : ""}>${esc(p.text)}${ackd[p.date] ? ` · acknowledged (${esc(ackd[p.date].by)}: ${esc(ackd[p.date].reason)})` : ""}</li>`).join("")}</ul>` : "";
  const recent = (a.recent || []).length ? `<div class="recent-h">Recent runs</div><ul class="recent">${a.recent.map((e) => `<li><span class="rd">${esc(fmtDate(e.date))}</span><span>${esc(e.summary)}</span></li>`).join("")}</ul>` : "";
  return `<div><b>${esc(a.verdict)}</b></div>${stripHTML(a)}${a.detail ? `<div class="src">${esc(a.detail)}</div>` : ""}${probs}${recent}<div class="src">Source: ${esc(a.source)}</div>`;
}

function matches(r) {
  if (!inGroup(r)) return false;
  if (state.section && r.section !== state.section) return false;
  if (state.chip && r.chip !== state.chip) return false;
  if (state.layer && layerGroup(r.layer) !== state.layer) return false;
  if (state.platform && !r.platforms.includes(state.platform)) return false;
  if (state.attn && !r.attention) return false;
  if (state.quiet && !r.activity.quiet) return false;
  if (state.q) {
    const hay = [r.name, r.description, r.platformsText, r.kind, r.runs, r.owner, r.seat, r.status, r.layer, ...r.details.map((d) => d[1])].join(" ").toLowerCase();
    const flat = hay.replace(/\s+/g, "");
    const starts = (w) => new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(hay);
    return state.q.split(/\s+/).every(starts) || (state.q.includes(" ") && flat.includes(state.q.replace(/\s+/g, "")));
  }
  return true;
}

const looksLikePath = (v) => /[\\/]|\.md\b/.test(v);
function rowHTML(r) {
  const links = r.links.length
    ? `<div class="links">${r.links.map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")}</div>`
    : `<span class="nolink">${r.chip === "Planned" ? "Not built yet" : /claude\.ai account/i.test(r.runs) ? "claude.ai account" : "No web link"}</span>`;
  const a = r.activity;
  currentAck = r.acknowledged;
  const actRow = `<dt>Activity</dt><dd>${actDetail(a)}</dd>`;
  const notes = r.status && !/^(Active|Live)$/.test(r.status) ? `<dt>Notes</dt><dd>${esc(r.status)}</dd>` : "";
  const plat = r.platformsText ? `<dt>Connected platforms</dt><dd>${esc(r.platformsText)}</dd>` : "";
  const rest = r.details.filter(([k]) => !["Status", "Connected platforms"].includes(k));
  const details = `<dt>Description</dt><dd>${r.description ? esc(r.description) : '<span class="desc missing">No description yet</span>'}</dd>` + actRow + plat + notes +
    `<dt></dt><dd><details class="allf"><summary>All fields</summary><dl>${rest.map(([k, v]) => `<dt>${esc(k)}</dt><dd class="${looksLikePath(v) && v.length < 160 ? "mono" : ""}">${esc(v)}</dd>`).join("")}${r.seat ? `<dt>Managed by</dt><dd>${esc(r.seat)} seat</dd>` : ""}</dl></details></dd>`;
  return `<div class="row${state.open.has(r.id) ? " open" : ""}" role="row">
    <div class="row-main" tabindex="0" data-id="${r.id}" aria-expanded="${state.open.has(r.id)}">
      <div class="c-name"><div class="name">${r.attention ? '<span class="flag" title="Needs attention"></span>' : ""}${esc(r.name)}</div><div class="kind">${esc(r.kind)}${r.seat ? ` · via ${esc(r.seat)}` : ""}</div></div>
      <div class="c-runs runs">${esc(r.where)}${r.platforms.length ? `<div class="plats">${r.platforms.map((p) => `<span class="plat">${esc(p)}</span>`).join("")}</div>` : ""}</div>
      <div class="c-status">${r.chip !== "Active" ? `<span class="status ${chipClass(r.chip)}">${esc(r.chip)}</span>` : ""}${actHTML(r.activity)}</div>
      <div class="c-links">${links}</div>
    </div>
    <div class="detail"><dl>${details}</dl></div>
  </div>`;
}

const SEATS = [["chief-of-staff", "Chief of staff", "Chief of staff"], ["coo", "COO", "COO"], ["cmo", "CMO", "CMO"]];
function workerCard(r, shared) {
  const planned = r.chip === "Planned";
  const a = r.activity;
  const meta = planned ? "Not built yet" : a.tracked ? a.verdict.replace(/^On demand · /, "") : a.note;
  const model = (r.details.find(([k]) => k === "Model") || [, ""])[1].split(/[(,;]/)[0].trim();
  return `<button class="worker${planned ? " planned" : ""}" data-name="${esc(r.name)}"><span class="t">${esc(r.name)}<span class="tags">${planned ? '<span class="tag planned">Planned</span>' : ""}${shared ? '<span class="tag shared">Shared</span>' : ""}</span></span><span class="m">${esc(meta)}${model && !planned ? " · " + esc(model) : ""}</span></button>`;
}
function drawOrg() {
  const rows = DATA.rows.filter((r) => r.reportsTo);
  const cols = SEATS.map(([id, title, key]) => {
    const seat = rows.find((r) => r.name === id);
    const workers = rows.filter((r) => r.reportsTo.startsWith(key) || (r.reportsTo.includes("and " + key)));
    const built = workers.filter((w) => w.chip !== "Planned");
    const sa = seat ? seat.activity : null;
    return `<div class="org-col">
      <button class="seat" data-name="${esc(id)}"><span class="t">${esc(title)}</span><span class="s">${sa && sa.tracked ? esc(sa.verdict.replace(/^On demand · /, "")) : ""}</span>${sa ? stripHTML(sa) : ""}</button>
      <div class="org-label">Workers · ${built.length} built, ${workers.length - built.length} planned</div>
      ${workers.length ? workers.map((w) => workerCard(w, /shared/i.test(w.reportsTo))).join("") : '<div class="org-empty">No workers yet</div>'}
    </div>`;
  }).join("");
  $("org").innerHTML = `<div class="org-top"><div class="org-brett">Brett</div><div class="org-stem"></div></div><div class="org-cols">${cols}</div>
    <p class="org-legend">Skills and scheduled tasks are tools the workforce uses, so they stay in the Systems view.</p>`;
}
function openRow(id, name) {
  Object.assign(state, { group: "All", section: null, chip: null, layer: "", platform: "", attn: false, quiet: false, q: name.toLowerCase() });
  $("q").value = name; state.open.add(id); render();
  $("ledger").scrollIntoView({ behavior: "smooth", block: "start" });
}
// Alerts: each one says what is wrong, what to do, and how it clears.
// Cleared alerts live in the page's database (collection "alertClears"), keyed by alert key,
// so a clear is shared, survives republishes, and the COO can read it back.
const alertState = { open: new Set(), cleared: new Map(), showCleared: false, db: null, canWrite: false, msg: "" };
function drawAlerts() {
  const all = DATA.alerts || [];
  const live = all.filter((x) => !alertState.cleared.has(x.key));
  const done = all.filter((x) => alertState.cleared.has(x.key));
  const label = { high: "Now", medium: "Recent", low: "Open" };
  const card = (x, isCleared) => {
    const open = alertState.open.has(x.key);
    const c = alertState.cleared.get(x.key);
    return `<li class="alert-item ${x.level}${open ? " open" : ""}">
      <button class="alert ${x.level}" data-key="${esc(x.key)}" aria-expanded="${open}"><span class="dot"></span><span class="lv">${isCleared ? "Cleared" : label[x.level]}</span><span class="tt">${esc(x.title)}</span><span class="chev">${open ? "−" : "+"}</span></button>
      ${open ? `<div class="alert-body">
        <div class="ab"><div class="ah">What's wrong</div><p>${esc(x.what)}</p></div>
        <div class="ab"><div class="ah">What to do</div><p>${esc(x.action)}</p>${x.link ? `<p><a href="${esc(x.link[1])}" target="_blank" rel="noopener">${esc(x.link[0])}</a></p>` : ""}</div>
        <div class="ab"><div class="ah">How it clears</div><p>${esc(x.clears)}</p></div>
        <div class="alert-actions">
          ${isCleared
            ? `<span class="cleared-note">Cleared ${c && c.at ? esc(new Date(c.at).toLocaleDateString("en-US", { month: "short", day: "numeric" })) : ""}</span>${alertState.canWrite ? `<button class="chip-btn" data-restore="${esc(x.key)}">Restore alert</button>` : ""}`
            : alertState.canWrite ? `<button class="btn-clear" data-clear-alert="${esc(x.key)}">Clear alert</button>` : `<span class="cleared-note">${alertState.db ? "You can view this page but not clear alerts." : "Clearing works when this page is open on claude.ai. Or tell the COO: “clear the " + esc(x.name || "activity") + " alert.”"}</span>`}
          ${x.id !== null && x.id !== undefined ? `<button class="chip-btn" data-open-row="${x.id}" data-name="${esc(x.name)}">Open the system</button>` : ""}
        </div>
        ${alertState.msg && alertState.open.has(x.key) ? `<div class="cleared-note">${esc(alertState.msg)}</div>` : ""}
      </div>` : ""}
    </li>`;
  };
  $("alerts").innerHTML = `<h2>Alerts <span class="n">${live.length}</span>${done.length ? `<button class="linkish" id="toggleCleared">${alertState.showCleared ? "Hide" : "Show"} cleared (${done.length})</button>` : ""}</h2>` +
    (live.length ? `<ul>${live.map((x) => card(x, false)).join("")}</ul>` : `<div class="ok">Nothing needs a look. Every scheduled system ran on time in the last ${DATA.stripDays} days, or you have cleared it.</div>`) +
    (alertState.showCleared && done.length ? `<ul class="cleared-list">${done.map((x) => card(x, true)).join("")}</ul>` : "");
}
$("alerts").addEventListener("click", async (e) => {
  const t = e.target;
  if (t.closest("#toggleCleared")) { alertState.showCleared = !alertState.showCleared; drawAlerts(); return; }
  const row = t.closest("[data-open-row]");
  if (row) { openRow(+row.dataset.openRow, row.dataset.name); return; }
  const clr = t.closest("[data-clear-alert]");
  const rst = t.closest("[data-restore]");
  if ((clr || rst) && alertState.db) {
    const key = (clr || rst).dataset.clearAlert || (clr || rst).dataset.restore;
    const x = (DATA.alerts || []).find((a) => a.key === key);
    (clr || rst).disabled = true;
    try {
      const ref = alertState.db.collection("alertClears").doc(key);
      if (clr) await ref.set({ key, title: x ? x.title : "", system: x ? x.name : "", at: new Date().toISOString(), by: alertState.uid || "" });
      else await ref.delete();
      alertState.msg = "";
    } catch (err) {
      alertState.msg = err && err.code === "permission_denied" ? "You do not have permission to clear alerts on this page." : "That did not save. Check your connection and try again.";
      (clr || rst).disabled = false; drawAlerts();
    }
    return;
  }
  const b = t.closest(".alert"); if (!b) return;
  const k = b.dataset.key; alertState.open.has(k) ? alertState.open.delete(k) : alertState.open.add(k); alertState.msg = ""; drawAlerts();
});
drawAlerts();
(async () => {
  const db = await (window.claude?.use?.("db") ?? Promise.resolve(null)).catch(() => null);
  if (!db) return;
  alertState.db = db;
  const user = await (window.claude?.use?.("user") ?? Promise.resolve(null)).catch(() => null);
  if (user) {
    try { alertState.uid = await user.id(); } catch (e) {}
    const can = user.can ? user.can("data.write") : null;
    alertState.canWrite = can !== false;
  } else { alertState.canWrite = true; }
  db.collection("alertClears").onSnapshot((snap) => {
    alertState.cleared = new Map(snap.docs.map((d) => [d.data().key || d.id, d.data()]));
    drawAlerts();
  }, () => { alertState.db = null; drawAlerts(); });
  drawAlerts();
})();
$("org").addEventListener("click", (e) => {
  const b = e.target.closest("[data-name]"); if (!b) return;
  const r = DATA.rows.find((x) => x.name === b.dataset.name);
  Object.assign(state, { group: "All", section: null, chip: null, layer: "", platform: "", attn: false, quiet: false, q: b.dataset.name.toLowerCase() });
  $("q").value = b.dataset.name; state.open.add(r.id); render();
  $("ledger").scrollIntoView({ behavior: "smooth", block: "start" });
});

function render() {
  drawStrip();
  const wf = state.group === "Workforce";
  $("org").hidden = !wf; $("controls").hidden = wf; $("ledger").hidden = wf;
  if (wf) { drawOrg(); return; }
  const list = DATA.rows.filter(matches);
  const filtered = !!(state.section || state.chip || state.layer || state.platform || state.attn || state.quiet || state.group !== "All");
  $("clear").hidden = !(state.section || state.chip || state.layer || state.platform || state.attn || state.quiet || state.q);
  let empty = `<div class="empty">No system mentions "${esc(state.q)}".</div>`;
  if (filtered) {
    const keep = { ...state }; Object.assign(state, { group: "All", section: null, chip: null, layer: "", platform: "", attn: false, quiet: false });
    const hidden = DATA.rows.filter(matches).length; Object.assign(state, keep);
    empty = `<div class="empty">No match with the current filters${hidden ? `, but ${hidden} ${hidden > 1 ? "rows match" : "row matches"} across everything` : ""}. <button class="chip-btn" data-clear>Show all matches</button></div>`;
  }
  $("rows").innerHTML = list.length ? list.map(rowHTML).join("") : empty;
  $("count").textContent = `${list.length} of ${DATA.rows.filter(inGroup).length} ${state.group === "All" ? "rows" : state.group.toLowerCase()}`;
}

function clearAll() { Object.assign(state, { q: "", section: null, chip: null, layer: "", platform: "", attn: false, quiet: false }); $("q").value = ""; $("platform").value = ""; render(); }
$("clear").addEventListener("click", clearAll);
$("rows").addEventListener("click", (e) => {
  if (e.target.closest("[data-clear]")) { const q = state.q; clearAll(); state.group = "All"; state.q = q; $("q").value = q; render(); return; }
  if (e.target.closest("a")) return;
  const m = e.target.closest(".row-main"); if (!m) return;
  const id = +m.dataset.id; state.open.has(id) ? state.open.delete(id) : state.open.add(id); render();
});
$("rows").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("row-main")) { e.preventDefault(); e.target.click(); }
});

render();
</script>
